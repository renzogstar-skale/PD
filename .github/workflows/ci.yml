name: CI B2B Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP 8.5
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo, pdo_sqlite, gd, intl, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Node dependencies
      run: npm ci || npm install

    - name: Start PHP server for testing
      run: php -S 127.0.0.1:8080 -t public router.php &
      env:
        GROCY_MODE: demo

    - name: Wait for server
      run: sleep 3

    - name: Healthcheck test
      run: curl -f http://127.0.0.1:8080/api/system/health

    - name: Run Step 13 Database Audit Suite
      run: node tests/test_b2b_step13.js
